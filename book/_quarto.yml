project:
  type: book
  output-dir: _book

book:
  title: "From First Line to First Paper"
  subtitle: "Mastering Python, Statistical Data Science, and Applied Deep Learning"
  author: "Mezanur Rahman Sharukh"
  date: "2026-11-22"
  date-format: "YYYY"
  chapters:
    - index.qmd
    - part: "Computational Thinking & Python from Absolute Zero"
      chapters:
        - part_01_python_foundations/ch01_first_program.qmd
        - part_01_python_foundations/ch02_variables_types.qmd
        - part_01_python_foundations/ch03_strings_input.qmd
        - part_01_python_foundations/ch04_conditionals_logic.qmd
        - part_01_python_foundations/ch05_loops_tracing.qmd
        - part_01_python_foundations/ch06_functions_scope.qmd
    - part: "Core Data Structures, Algorithmic Thinking & Defensive Programming"
      chapters:
        - part_02_data_structures_algorithms/ch07_lists_aliasing.qmd
        - part_02_data_structures_algorithms/ch08_tuples_sets_dicts.qmd
        - part_02_data_structures_algorithms/ch09_files_csv_json.qmd
        - part_02_data_structures_algorithms/ch10_exceptions_testing.qmd
        - part_02_data_structures_algorithms/ch11_algorithms_complexity.qmd
    - part: "Software Engineering for Data Scientists"
      chapters:
        - part_03_engineering_workflow/ch12_oop_for_ml.qmd
        - part_03_engineering_workflow/ch13_jupyter_colab.qmd
        - part_03_engineering_workflow/ch14_vscode_packages.qmd
        - part_03_engineering_workflow/ch15_git_clean_code.qmd
    # Subsequent Parts (Part IV Ch 16–20 through Part VII Ch 33–36 & Appendices A–D) plug in seamlessly here
    # as each chapter is authored and verified by scripts/verify_all.py.

execute:
  freeze: auto
  echo: true
  warning: false

format:
  html:
    theme:
      - cosmo
      - styles/book_theme.scss
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-line-numbers: true
  pdf:
    documentclass: scrbook
    pdf-engine: xelatex
    papersize: letter
    fontsize: 10.5pt
    geometry:
      - top=1in
      - bottom=1in
      - inner=1.1in
      - outer=0.9in
    include-in-header: styles/preamble.tex
    toc: true
    toc-depth: 3
    number-sections: true
    colorlinks: true
    linkcolor: NavyBlue
    urlcolor: RoyalBlue
  epub:
    toc: true
    number-sections: true
