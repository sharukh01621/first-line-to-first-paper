[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharukh-tutor"
version = "0.5.0"
description = "Interactive hints, diagnostic self-checks, and Public Health datasets for 'From First Line to First Paper' by Mezanur Rahman Sharukh."
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Mezanur Rahman Sharukh"}
]
requires-python = ">=3.10"
keywords = ["education", "python", "data-science", "machine-learning", "public-health", "colab"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]

[project.optional-dependencies]
data = ["pandas>=2.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sharukh_tutor = ["data/*.csv"]
